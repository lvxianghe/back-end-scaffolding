# tomcat配置
server:
  port: 10001
  servlet:
    context-path: /

# spring配置
spring:
  application:
    name: main
  main:
    allow-bean-definition-overriding: true

  # 🔥 Dynamic DataSource配置
  datasource:
    dynamic:
      primary: master
      strict: false
      datasource:
        master:
          url: jdbc:mysql://localhost:3306/ysx?useUnicode=true&characterEncoding=utf8&serverTimezone=GMT%2B8&useSSL=false&allowPublicKeyRetrieval=true
          username: root
          password: root
          driver-class-name: com.mysql.cj.jdbc.Driver
          type: com.alibaba.druid.pool.DruidDataSource  # 指定使用Druid
      # 🔥 Druid配置（通过Dynamic DataSource）
      druid:
        initial-size: 5
        min-idle: 5
        max-active: 20
        max-wait: 60000
        time-between-eviction-runs-millis: 60000
        min-evictable-idle-time-millis: 300000
        validation-query: SELECT 1
        test-while-idle: true
        test-on-borrow: false
        test-on-return: false
        filters: stat,wall
        # 🔥 监控配置（Dynamic DataSource方式）
        stat-view-servlet:
          enabled: true
          url-pattern: /druid/*
          login-username: admin
          login-password: admin123
        web-stat-filter:
          enabled: true
          url-pattern: /*
          exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*,/swagger-ui/*"


  # Redis配置 - 最佳实践版本
  data:
    redis:
      # =================== 基础连接配置 ===================
      # Redis服务器地址
      host: localhost
      # Redis服务器端口
      port: 6379
      # Redis密码（生产环境建议设置密码）
      # password: your_redis_password
      # 数据库索引（0-15，建议不同业务使用不同库）
      database: 0
      # 连接超时时间（建议3-5秒）
      timeout: 3000ms
      
      # =================== Lettuce配置（推荐）===================
      # Lettuce是Spring Boot 3.x默认的Redis客户端
      # 优势：基于Netty的NIO，支持异步、连接复用、高性能
      lettuce:
        pool:
          # 连接池最大连接数（生产环境建议根据并发量调整，一般8-20）
          max-active: 10
          # 连接池最大阻塞等待时间（-1表示无限等待，生产环境建议设置具体值）
          max-wait: 3000ms
          # 连接池中的最大空闲连接（建议与max-active相等或略小）
          max-idle: 8
          # 连接池中的最小空闲连接（建议设置为2-4，保持一定的预热连接）
          min-idle: 2
        # 关闭超时时间（连接闲置多久后关闭）
        shutdown-timeout: 100ms
        
      # =================== 性能优化配置 ===================
      # 客户端名称（便于监控和调试）
      client-name: ${spring.application.name}
      # 客户端类型（lettuce或jedis，Spring Boot 3.x默认lettuce）
      client-type: lettuce

# SpringDoc OpenAPI 配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: org.xiaoxingbomei.controller

# 🔥 MyBatis-Plus配置
mybatis-plus:
  # 映射文件位置
  mapper-locations: classpath*:mapper/**/*Mapper.xml
  # 实体类包路径
  type-aliases-package: org.xiaoxingbomei.entity
  configuration:
    # 开启驼峰命名转换
    map-underscore-to-camel-case: true
    # 开启SQL日志打印
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

    # 开启二级缓存
    cache-enabled: true
    # 开启延迟加载
    lazy-loading-enabled: true
    # 按需加载属性
    aggressive-lazy-loading: false
  global-config:
    db-config:
      # 主键类型（AUTO-自增，ASSIGN_ID-雪花算法）
      id-type: AUTO
      # 逻辑删除字段
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      # 表名前缀
      table-prefix: ""
    # 是否开启Banner
    banner: true

# 日志配置
logging:
  level:
    # SQL监控相关日志
    org.xiaoxingbomei.config.datasource: info
    # 数据源切换日志
    com.baomidou.dynamic.datasource: debug
    # MyBatis SQL日志（可以关闭，因为我们有自定义监控）
    org.xiaoxingbomei.mapper: warn
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
